<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – RideFlow</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Inter", sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #1F2A37;
        }

        .container {
            width: 380px;
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            text-align: center;
        }

        h2 {
            margin-bottom: 8px;
            font-size: 26px;
            font-weight: 600;
        }

        .subtext {
            color: #6B7280;
            font-size: 14px;
            margin-bottom: 22px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #E5E7EB;
            background: #F5F7FA;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
        }

        input:focus {
            border-color: #10B8C7;
            box-shadow: 0 0 4px rgba(16, 184, 199, 0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            background: linear-gradient(135deg, #10B8C7, #0FA6D8);
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            color: #d9534f;
            margin-top: 10px;
        }

        .footer {
            margin-top: 18px;
            font-size: 14px;
            color: #6B7280;
        }

        a {
            color: #0FA6D8;
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>

</head>
<body>

<div class="container">
    <h2>Welcome Back</h2>
    <p class="subtext">Sign in to continue your journey 🚗</p>

    <form action="/login" method="post">
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <p class="footer">
        Don't have an account?
        <a href="/register">Create Account</a>
    </p>
</div>

</body>
</html>
