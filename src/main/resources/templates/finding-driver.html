<!DOCTYPE html>
<html>
<head>
    <title>Finding Driver</title>
    <style>
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            animation: spin 1s linear infinite;
            margin: auto;
            margin-top: 120px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            text-align: center;
            margin-top: 20px;
            font-family: Arial;
        }
    </style>

    <script>
        setTimeout(function() {
window.location.href = "/driver-assigned?pickup=[[${pickup}]]&drop=[[${drop}]]&vehicle=[[${vehicle}]]";
 }, 3000);

    </script>
</head>
<body>

<div class="loader"></div>
<h2>Looking for nearby drivers...</h2>

</body>
</html>
