<!DOCTYPE html>
<html>
<head>
    <title>Book a Ride</title>
</head>
<body>

<h2>Book Your Ride</h2>

<form action="/processBooking" method="post">
    <label>Pickup Location:</label><br>
    <input type="text" name="pickup" required><br><br>

    <label>Drop Location:</label><br>
    <input type="text" name="drop" required><br><br>

    <label>Select Vehicle:</label><br>
    <input type="radio" name="vehicle" value="Auto" required> Auto (₹8/km)<br>
    <input type="radio" name="vehicle" value="Mini"> Mini (₹10/km)<br>
    <input type="radio" name="vehicle" value="Sedan"> Sedan (₹14/km)<br>
    <input type="radio" name="vehicle" value="SUV"> SUV (₹18/km)<br><br>

    <button type="submit">Book Ride</button>
</form>
<a href="/my-rides">My Rides</a>

</body>
</html>
