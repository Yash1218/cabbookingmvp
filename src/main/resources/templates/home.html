<!DOCTYPE html>
<html>
<head>
    <title>Book a Ride</title>
</head>
<body>

<h2>Book Your Ride</h2>

<form action="/ride" method="post">
    <label>Pickup Location:</label><br>
    <input type="text" name="pickup" placeholder="Enter pickup location" required><br><br>

    <label>Drop Location:</label><br>
    <input type="text" name="drop" placeholder="Enter drop location" required><br><br>

    <button type="submit">Book Ride</button>
</form>

</body>
</html>
