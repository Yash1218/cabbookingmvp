<!DOCTYPE html>
<html>
<head>
    <title>Your Ride</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        #map {
            height: 500px;
            width: 100%;
            border: 1px solid #000;
            margin-top: 10px;
        }

        .ads-box {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: white;
            border: 1px solid #ccc;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
            z-index: 999;
            .leaflet-control-attribution {
    display: none !important;
}

        }
    </style>
</head>
<body>

<h2>Your Ride</h2>

<p><b>Pickup:</b> <span th:text="${pickup}"></span></p>
<p><b>Drop:</b> <span th:text="${drop}"></span></p>

<div id="map"></div>

<!-- Floating ADS Suggestion -->
<div class="ads-box">
    <h4>Nearby Suggestions</h4>
    <p>Food | Tourism | Shopping</p>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    var pickup = "[[${pickup}]]";
    var drop = "[[${drop}]]";

    var map = L.map('map').setView([18.5204, 73.8567], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
    }).addTo(map);

    function geocode(location, callback) {
        fetch("https://nominatim.openstreetmap.org/search?format=json&q=" + location)
            .then(response => response.json())
            .then(data => {
                if (data.length > 0) {
                    callback([data[0].lat, data[0].lon]);
                }
            });
    }

    geocode(pickup, function(pickupCoords) {
        geocode(drop, function(dropCoords) {

            L.marker(pickupCoords).addTo(map).bindPopup("Pickup");
            L.marker(dropCoords).addTo(map).bindPopup("Drop");

            var group = new L.featureGroup([
                L.marker(pickupCoords),
                L.marker(dropCoords)
            ]);
            map.fitBounds(group.getBounds());

            L.polyline([pickupCoords, dropCoords], {color: 'blue'}).addTo(map);
        });
    });

    // --------------------- ADS SYSTEM ---------------------
    let ads = [];
    let currentIndex = 0;

    // Fetch ADS suggestions
    fetch("/ads/suggestions?city=Pune")
        .then(response => response.json())
        .then(data => {
            ads = data;
            showAd(0);
            setInterval(showNextAd, 3000); // Rotate every 3 seconds
        });

    function showAd(index) {
        let adsBox = document.querySelector(".ads-box");
        adsBox.innerHTML = ""; // Clear previous ad

        if (ads.length === 0) {
            adsBox.innerHTML = "<p>No suggestions available</p>";
            return;
        }

        let poi = ads[index];
        adsBox.innerHTML = `
            <div style="
                border: 1px solid #ccc;
                padding: 10px;
                border-radius: 10px;
                background: white;
            ">
                <b>${poi.name}</b><br>
                <small>${poi.category}</small><br>
                <span style="font-size: 12px;">${poi.description}</span>
            </div>
        `;
    }

    function showNextAd() {
        currentIndex = (currentIndex + 1) % ads.length;
        showAd(currentIndex);
    }
</script>

</body>
</html>
